version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: clouddoc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clouddoc_user
      POSTGRES_PASSWORD: clouddoc_password
      POSTGRES_DB: clouddoc_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clouddoc_user -d clouddoc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clouddoc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clouddoc-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://clouddoc_user:clouddoc_password@postgres:5432/clouddoc_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super-secure-jwt-production-secret-clouddoc-2026-key
      JWT_EXPIRES_IN: 1d
      JWT_REFRESH_SECRET: super-secure-refresh-token-secret-clouddoc-2026
      JWT_REFRESH_EXPIRES_IN: 7d
      STORAGE_DRIVER: local
      LOCAL_STORAGE_DIR: /app/uploads
      CORS_ORIGIN: http://localhost:3000
      AI_PROVIDER: heuristic
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clouddoc-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
